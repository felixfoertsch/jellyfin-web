name: Patched Jellyfin Web

on:
  push:
    branches: [automation]
  schedule:
    # Fastest GitHub-hosted schedule; not an upstream webhook or timing SLA.
    - cron: '2-59/5 * * * *'
  repository_dispatch:
    types: [upstream-updated]
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild even when both channels are already published
        type: boolean
        default: false

# Coalesce wake-ups, but never cancel a running publisher halfway through.
# Retain the old group so legacy and new publishers cannot overlap.
concurrency:
  group: downstream-master
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  sync-test-publish:
    name: Build and publish ${{ matrix.channel }}
    if: github.repository == 'felixfoertsch/jellyfin-web' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/automation')
    strategy:
      fail-fast: false
      matrix:
        channel: [release, nightly]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the current fork tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: automation
          fetch-depth: 0
          persist-credentials: false

      - name: Test ancestry, patch replay, channel isolation and freshness gates
        run: python3 -m unittest discover -s .downstream/tests -v

      - name: Capture publication leases
        id: leases
        run: |
          echo "main_sha=$(git ls-remote origin refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "automation_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve official release or upstream master
        id: channel
        env:
          GH_TOKEN: ${{ github.token }}
        # Dispatch payloads are deliberately ignored: only fixed upstream refs.
        run: python3 .downstream/channels.py resolve '${{ matrix.channel }}'

      - name: Reconstruct upstream plus patches and preserve upstream ancestry
        id: source
        env:
          UPSTREAM_REF: ${{ steps.channel.outputs.upstream_ref }}
        run: python3 .downstream/sync-upstream.py --upstream-ref "$UPSTREAM_REF"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan tags and check whether this source is already published
        id: publication
        env:
          UPSTREAM_VERSION: ${{ steps.channel.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.source.outputs.source_tree }}
          FORCE_REBUILD: ${{ inputs.rebuild || false }}
        run: python3 .downstream/channels.py plan '${{ matrix.channel }}'

      - name: Build, run regression tests, and compile production assets
        if: steps.publication.outputs.build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .downstream/Dockerfile
          platforms: linux/amd64
          load: true
          pull: true
          tags: jellyfin-web-smoke:local
          build-args: |
            SOURCE_REVISION=${{ steps.source.outputs.source_sha }}
            UPSTREAM_REVISION=${{ steps.source.outputs.upstream_sha }}
            CHANNEL=${{ matrix.channel }}
            UPSTREAM_VERSION=${{ steps.channel.outputs.version }}
          cache-from: type=gha,scope=patched-web-${{ matrix.channel }}
          cache-to: type=gha,mode=max,scope=patched-web-${{ matrix.channel }}

      - name: Smoke-test static files, API routing, and WebSockets
        if: steps.publication.outputs.build == 'true'
        run: bash .downstream/smoke-test.sh jellyfin-web-smoke:local

      - name: Build and upload candidate without moving rolling tags
        if: steps.publication.outputs.build == 'true'
        id: candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .downstream/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.publication.outputs.candidate_image }}
          build-args: |
            SOURCE_REVISION=${{ steps.source.outputs.source_sha }}
            UPSTREAM_REVISION=${{ steps.source.outputs.upstream_sha }}
            CHANNEL=${{ matrix.channel }}
            UPSTREAM_VERSION=${{ steps.channel.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/felixfoertsch/jellyfin-web
            org.opencontainers.image.revision=${{ steps.source.outputs.source_sha }}
            org.opencontainers.image.version=${{ steps.channel.outputs.version }}
            org.opencontainers.image.licenses=GPL-2.0-or-later
          cache-from: type=gha,scope=patched-web-${{ matrix.channel }}
          cache-to: type=gha,mode=max,scope=patched-web-${{ matrix.channel }}
          provenance: mode=max
          sbom: true

      - name: Reject changed automation tooling
        env:
          EXPECTED_AUTOMATION: ${{ steps.leases.outputs.automation_sha }}
        run: test "$(git ls-remote origin refs/heads/automation | cut -f1)" = "$EXPECTED_AUTOMATION"

      - name: Reject superseded source and request a catch-up run
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REF: ${{ steps.channel.outputs.upstream_ref }}
          UPSTREAM_SHA: ${{ steps.source.outputs.upstream_sha }}
        run: python3 .downstream/freshness.py '${{ matrix.channel }}' --dispatch-if-changed

      - name: Replace main with current validated upstream plus patch stack
        if: matrix.channel == 'nightly' && steps.freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE: ${{ steps.leases.outputs.main_sha }}
          EXPECTED_AUTOMATION: ${{ steps.leases.outputs.automation_sha }}
          EXPECTED_UPSTREAM: ${{ steps.source.outputs.upstream_sha }}
        run: |
          git merge-base --is-ancestor "$EXPECTED_UPSTREAM" HEAD
          test "$(git rev-list --count "HEAD..$EXPECTED_UPSTREAM")" = 0
          bash .downstream/push-source.sh

      - name: Preserve current validated release source under its own Git tag
        if: matrix.channel == 'release' && steps.publication.outputs.build == 'true' && steps.freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.publication.outputs.source_tag }}
        run: bash .downstream/push-release-source.sh

      - name: Promote the built digest to this channel only
        if: steps.publication.outputs.build == 'true' && steps.freshness.outputs.current == 'true'
        env:
          UPSTREAM_VERSION: ${{ steps.channel.outputs.version }}
          PUBLICATION_MARKER: ${{ steps.publication.outputs.marker }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: python3 .downstream/channels.py promote '${{ matrix.channel }}'

      - name: Check again after publication and immediately request catch-up if needed
        if: steps.freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REF: ${{ steps.channel.outputs.upstream_ref }}
          UPSTREAM_SHA: ${{ steps.source.outputs.upstream_sha }}
        run: python3 .downstream/freshness.py '${{ matrix.channel }}' --dispatch-if-changed

      - name: Write channel deployment summary
        env:
          CHANNEL: ${{ matrix.channel }}
          UPSTREAM_REF: ${{ steps.channel.outputs.upstream_ref }}
          UPSTREAM_SHA: ${{ steps.source.outputs.upstream_sha }}
          IMAGE: ${{ steps.publication.outputs.image }}
          BUILT: ${{ steps.publication.outputs.build }}
          BUILD_TAG: ${{ steps.publication.outputs.build_tag }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          SOURCE_TAG: ${{ steps.publication.outputs.source_tag }}
          CURRENT: ${{ steps.freshness.outputs.current }}
        run: |
          {
            echo "## Patched Jellyfin Web: $CHANNEL"
            echo "Upstream: \`$UPSTREAM_REF\` at \`$UPSTREAM_SHA\`"
            echo "Image: \`$IMAGE\`"
            if [[ "$CURRENT" != true ]]; then
              echo 'Upstream moved during this run. No source/rolling-tag promotion; catch-up requested.'
            elif [[ "$BUILT" == true ]]; then
              echo "Build tag: \`$BUILD_TAG\`"
              echo "Digest: \`$DIGEST\`"
              [[ -z "$SOURCE_TAG" ]] || echo "Corresponding source Git tag: \`$SOURCE_TAG\`"
            else
              echo 'Already published: matching source tree, architectures and channel aliases. Ancestry checked.'
            fi
            echo 'latest/stable = official release tag + patches; nightly/edge = upstream master + patches.'
            echo 'Five-minute polling is best-effort. Dispatch events are wake-ups, not alternate source instructions.'
          } >> "$GITHUB_STEP_SUMMARY"
