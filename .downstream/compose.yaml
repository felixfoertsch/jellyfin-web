# Standalone deployment: attach this service to the server's existing network.
# Set JELLYFIN_DOCKER_NETWORK to that Docker network name before running Compose.
# latest = official release + patch; nightly = upstream master + patch.
services:
  jellyfin-web:
    image: ghcr.io/felixfoertsch/jellyfin-web:${JELLYFIN_WEB_TAG:-latest}
    restart: unless-stopped
    environment:
      JELLYFIN_SERVER: ${JELLYFIN_SERVER:-jellyfin:8096}
    ports:
      - "127.0.0.1:8097:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [jellyfin]
networks:
  jellyfin:
    external: true
    name: ${JELLYFIN_DOCKER_NETWORK:-jellyfin}
